version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=maraya_db
      - POSTGRES_USER=maraya_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=maraya_user
      - POSTGRES_DB=maraya_db
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=maraya_user
      - POSTGRES_DB=maraya_db
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
      - redis
      - backend

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=maraya_user
      - POSTGRES_DB=maraya_db
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
      - redis
      - backend

  frontend:
    image: node:20-alpine
    command: sh -c "echo 'Frontend placeholder' && sleep infinity" # Placeholder command
    volumes:
      - ./frontend:/app/frontend # Assuming frontend code will be in a 'frontend' directory
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  postgres_data:
