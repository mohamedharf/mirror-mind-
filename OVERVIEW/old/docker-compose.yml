version: '3.9'

services:

  # ─────────────────────────────────────────
  # PostgreSQL — قاعدة البيانات (prod-ready)
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: maraya_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maraya
      POSTGRES_USER: maraya
      POSTGRES_PASSWORD: maraya_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maraya -d maraya"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # Redis — Celery broker + result backend
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: maraya_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────
  # Django Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: maraya_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://maraya:maraya_dev_pass@db:5432/maraya
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - whisper_models:/app/whisper_models   # cache موديل Whisper
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # ─────────────────────────────────────────
  # Celery Worker — معالجة LLM extraction
  # ─────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: maraya_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://maraya:maraya_dev_pass@db:5432/maraya
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=2

  # ─────────────────────────────────────────
  # Celery Beat — الجدولة الدورية
  # ─────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: maraya_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://maraya:maraya_dev_pass@db:5432/maraya
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A config beat --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ─────────────────────────────────────────
  # Frontend React (dev server)
  # ─────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: maraya_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

volumes:
  postgres_data:
  whisper_models:
  node_modules:
